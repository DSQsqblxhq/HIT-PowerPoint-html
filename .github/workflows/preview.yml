name: Update Preview Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Take screenshots
        run: |
          mkdir -p docs/screenshots
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');

          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
              const base = pathToFileURL(path.resolve('HIT-HTML.html')).href;
              const targets = [
                { index: 0, name: 'cover' },  // 封面页
                { index: 6, name: 'ending' }, // 结尾页
                { index: 1, name: 'toc' },    // 目录页
                { index: 7, name: 'master' }  // 母版页
              ];

              for (const target of targets) {
                await page.goto(base + '#/' + target.index, { waitUntil: 'load' });
                await page.waitForFunction(
                  index => document.querySelectorAll('.slide')[index]?.classList.contains('active'),
                  target.index
                );
                await page.evaluate(() => document.fonts.ready);
                await page.addStyleTag({ content: '.controls,.notes-panel{display:none!important}' });
                await page.screenshot({
                  path: 'docs/screenshots/' + target.name + '.png',
                  animations: 'disabled'
                });
              }
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update preview screenshots"
          file_pattern: "docs/screenshots/*.png"
