name: Update Preview Screenshots

on:
  push:
    branches: [main]
  pull_request:
    paths: [HIT-HTML.html, tests/**, .github/workflows/preview.yml]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji xserver-xorg-core xserver-xorg-video-dummy x11-utils x11-xserver-utils openbox
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify template styles refresh without reloading
        run: node tests/template-style-refresh.cjs

      - name: Verify repeated web swaps with delayed window placement
        run: node tests/web-swap.cjs

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Verify HTTPS automatic audience fullscreen
        run: bash tests/native-displays.sh

      - name: Verify presenter placement on secondary screens
        run: node tests/presenter-multiscreen.cjs

      - name: Take screenshots
        run: |
          mkdir -p docs/screenshots
          node <<'NODE'
          const {chromium}=require('playwright');
          const path=require('node:path');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {pathToFileURL}=require('node:url');

          (async()=>{
           const browser=await chromium.launch();
           try{
            const context=await browser.newContext({viewport:{width:1920,height:1080},reducedMotion:'reduce',timezoneId:'Asia/Shanghai'});
            await context.addInitScript(()=>{window.getScreenDetails=undefined});
            const errors=[];context.on('page',p=>p.on('pageerror',e=>errors.push(e.message)));
            const page=await context.newPage();
            const base=pathToFileURL(path.resolve('HIT-HTML.html')).href;
            fs.mkdirSync('docs/screenshots',{recursive:true});
            const targets=[{index:0,name:'cover'},{index:8,name:'ending'},{index:9,name:'master'},{index:3,name:'content'},{index:4,name:'route'}];
            for(const target of targets){
             await page.goto(base+'#/'+target.index,{waitUntil:'load'});
             await page.waitForFunction(index=>document.querySelectorAll('#stage > .slide')[index]?.classList.contains('active'),target.index);
             await page.evaluate(()=>document.fonts.ready);
             await page.addStyleTag({content:'.controls{display:none!important}'});
             await page.screenshot({path:'docs/screenshots/'+target.name+'.png',animations:'disabled'});
            }
            await page.goto(base+'#/3',{waitUntil:'load'});
            await page.clock.setFixedTime(new Date('2026-10-15T00:00:00+08:00'));
            const popup=page.waitForEvent('popup');
            await page.keyboard.press('s');
            const audience=await popup;await audience.waitForLoadState();
            await page.waitForFunction(()=>document.getElementById('presenter-status').classList.contains('connected'));
            await page.locator('#presenter-timer-reset').click();
            await page.locator('#presenter-layout').click();
            await page.evaluate(()=>document.fonts.ready);
            await page.waitForFunction(()=>document.getElementById('preview-current-stage').childElementCount>0&&document.getElementById('preview-next-stage').childElementCount>0);
            assert.equal(await page.locator('#presenter-counter').textContent(),'4 / 10');
            assert.equal(new URL(page.url()).searchParams.has('hit-session'),false);
            await page.locator('#presenter-layout').blur();
            await page.screenshot({path:'docs/screenshots/presenter.png',animations:'disabled'});
            assert.deepEqual(errors,[]);
            await context.close();
            console.log('Captured cover, ending, master, content, route and connected presenter workspace without JavaScript errors');
           }finally{await browser.close()}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Commit screenshots
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update preview screenshots"
          file_pattern: "docs/screenshots/*.png"

