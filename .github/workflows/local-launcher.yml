name: Verify Local Launcher

on:
  pull_request:
    paths:
      - HIT-HTML.html
      - src/**
      - tools/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/actions/**
      - .github/workflows/local-launcher.yml
  push:
    branches: [main]
    paths:
      - HIT-HTML.html
      - src/**
      - tools/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/actions/**
      - .github/workflows/local-launcher.yml
  workflow_dispatch:
  workflow_call:

# A reusable call from release.yml and the direct push trigger must not cancel each
# other: the caller is part of github.workflow, so each run gets its own group.
concurrency:
  group: local-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      POWERSHELL_UPDATECHECK: 'Off'
    strategy:
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-deck-env
        with:
          system: none

      - name: Verify the committed deck matches src/
        run: python tools/build_html.py --check

      - name: Verify deck content and release metadata
        run: node tests/deck-structure.cjs

      - name: Build single-file launcher
        run: python tools/package_local.py

      - name: Verify the launcher survives a damaged CMD
        env:
          HIT_POWERSHELL_EXECUTABLE: ${{ matrix.powershell }}
        run: node tests/local-launcher-offline.cjs

      - name: Verify Windows PowerShell launcher and native quit keys
        env:
          HIT_POWERSHELL_EXECUTABLE: ${{ matrix.powershell }}
        run: node tests/local-launcher.cjs

      - name: Verify managed browser shutdown and isolation
        env:
          HIT_POWERSHELL_EXECUTABLE: ${{ matrix.powershell }}
        run: |
          $browsers = @("${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe", "$env:ProgramFiles/Google/Chrome/Application/chrome.exe")
          $tested = 0
          foreach ($browser in $browsers) {
            if (Test-Path -LiteralPath $browser) {
              $tested++
              Write-Output "Testing $browser"
              $env:HIT_CHROME_EXECUTABLE = $browser
              node tests/launcher-browser.cjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if ($tested -eq 0) { throw 'No Edge or Chrome installation found' }
