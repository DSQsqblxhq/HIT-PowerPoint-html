name: Publish or Update v1.2 Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload, verify and publish v1.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          新版哈尔滨工业大学学术汇报 HTML 模板，保留原有 HIT 配色与幻灯片风格。

          - 新增演讲者工作台：当前页与下一页预览、逐页讲稿、全程与本页计时、当前时钟、讲稿字号调节及可保存的卡片布局。
          - 支持演讲者和观众双窗口同步翻页、屏幕选择与全屏放映；先完成浏览器屏幕权限询问，再打开观众窗口。
          - 修复工作台“副屏全屏”与 F 快捷键：直接让观众窗口全屏，无需在观众窗口再次点击；支持在线与本地 HTML。本地窗口刷新后若提示重连，再在工作台点击一次即可，当前页与计时会保留。
          - 新增幻灯片总览，点击缩略图跳转；统一观众底栏，保留翻页、总览和全屏。
          - 主页面底栏功能按钮按“演讲者、总览、全屏、打印”排列。
          - 精简内嵌 SVG 路径与放映脚本，文件从 230,615 字节降至 173,826 字节，缩小 24.6%；保留原有风格、离线使用、演讲者功能及完整来源与许可说明。
          - 移除原“目录”“讲稿”底栏按钮及角色互换功能，讲稿改在工作台阅读。
          - 已用时间数字为当前时钟数字字号的 1.5 倍；地址栏不再显示会话编号，刷新后可恢复同一放映会话。
          - 调整封面网格布局：中英文标题垂直居中、线条随标题宽度调整、信息按 2×2 排列。
          - README 下载链接更新至 v1.2，预览按封面、结尾、母版、演讲者工作台排列，并更新使用说明。
          - 演讲者模式参考 lewislulu/html-ppt-skill（MIT，作者 lewis），仓库与单文件已补充来源、署名及许可原文。

          下载附件 `HIT-HTML.html` 后用浏览器打开，可离线放映。
          EOF
          if gh release view v1.2 > /dev/null 2>&1; then
            gh release upload v1.2 HIT-HTML.html --clobber
          else
            gh release create v1.2 HIT-HTML.html \
              --target "$GITHUB_SHA" \
              --title "HIT-HTML v1.2" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft
          fi
          gh release download v1.2 \
            --pattern HIT-HTML.html \
            --dir "$RUNNER_TEMP/release-v1.2"
          cmp HIT-HTML.html "$RUNNER_TEMP/release-v1.2/HIT-HTML.html"
          gh release edit v1.2 --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.md"


