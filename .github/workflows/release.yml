name: Publish v1.1 Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload, verify and publish v1.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          新版哈尔滨工业大学学术汇报 HTML 模板。

          - 更新工程蓝图风封面与结尾页，使用标准校徽、校名文字及主楼 SVG。
          - 封面保留院系、导师、汇报人和汇报时间，移除“哈尔滨工业大学 · 学术汇报”。
          - 结尾页校训与母版页保持一致，保留原有配色与视觉风格。
          - 复用 SVG、裁剪内嵌字体并清理冗余样式，精简新版文件体积。
          - 新增封面页和结尾页截图，README 按封面、结尾、目录、母版顺序展示 2×2 预览。

          下载附件 `HIT-HTML.html` 后用浏览器打开，可离线放映。
          EOF
          gh release create v1.1 HIT-HTML.html \
            --target "$GITHUB_SHA" \
            --title "HIT-HTML v1.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release download v1.1 \
            --pattern HIT-HTML.html \
            --dir "$RUNNER_TEMP/release-v1.1"
          cmp HIT-HTML.html "$RUNNER_TEMP/release-v1.1/HIT-HTML.html"
          gh release edit v1.1 --draft=false --latest
