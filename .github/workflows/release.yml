name: Publish or Update v1.2 Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.2
  cancel-in-progress: false

jobs:
  verify-windows:
    uses: ./.github/workflows/local-launcher.yml

  release:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build single-file local launcher
        run: python3 tools/package_local.py
      - name: Verify local launcher with native secondary screens
        env:
          HIT_POWERSHELL_EXECUTABLE: pwsh
          HIT_VERIFY_LAUNCHER_SCREENS: '1'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          node tests/local-launcher.cjs
      - name: Upload, verify and publish v1.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          新版哈尔滨工业大学学术汇报 HTML 模板，保留原有 HIT 配色与幻灯片风格。

          - 新增演讲者工作台：当前页与下一页预览、逐页讲稿、全程与本页计时、当前时钟、讲稿字号调节及可保存的卡片布局。
          - 支持演讲者和观众双窗口同步翻页、屏幕选择与全屏放映；先完成浏览器屏幕权限询问，再打开观众窗口。
          - 取得屏幕管理权限后自动锁定副屏，加载后校验位置并重试；全屏前先确认已到达目标屏幕，支持左右两侧副屏。
          - Windows 本地双屏改为一个 HIT-HTML-local.cmd：HTML、启动服务、使用说明和来源许可全部内嵌，无需配套文件，不会解压或生成临时 HTML；双击即可通过 127.0.0.1 打开，无需联网、Python 或管理员权限。首次使用需单独允许本机地址的屏幕管理请求；演示期间保持启动窗口打开。
          - 精简体积：HTML 177,208 → 168,010 字节（约减少 5.2%），CMD 194,082 → 118,449 字节（约减少 39.0%）。固定 SVG、样式和脚本在 CMD 内压缩，由本机服务在内存中还原；页面文字、CONFIG 章节和 NOTES 讲稿仍可直接编辑，完整来源与许可保留。
          - Release 附件仅保留 HIT-HTML.html 与 HIT-HTML-local.cmd，移除旧 ZIP。
          - 本地 HTML 未取得屏幕管理权限时明确提示使用启动包或手动移动窗口，不再自动在当前屏幕全屏。在线网页授权不会继承给直接打开的本地文件。
          - 修复工作台“副屏全屏”与 F 快捷键：直接让观众窗口全屏，无需在观众窗口再次点击；支持在线与本地 HTML。本地窗口刷新后若提示重连，再在工作台点击一次即可，当前页与计时会保留。
          - 新增幻灯片总览，点击缩略图跳转；统一观众底栏，保留翻页、总览和全屏。
          - 主页面底栏功能按钮按“演讲者、总览、全屏、打印”排列。
          - 精简内嵌 SVG 路径与放映脚本，保留原有风格、离线使用、演讲者功能及完整来源与许可说明。
          - 移除原“目录”“讲稿”底栏按钮及角色互换功能，讲稿改在工作台阅读。
          - 已用时间数字为当前时钟数字字号的 1.5 倍；地址栏不再显示会话编号，刷新后可恢复同一放映会话。
          - 调整封面网格布局：中英文标题垂直居中、线条随标题宽度调整、信息按 2×2 排列。
          - README 下载链接更新至 v1.2，预览按封面、结尾、母版、演讲者工作台排列，并更新使用说明。
          - 演讲者模式参考 lewislulu/html-ppt-skill（MIT，作者 lewis），仓库与单文件已补充来源、署名及许可原文。

          单屏或手动双屏：下载 `HIT-HTML.html`，直接用浏览器打开，可离线放映。
          本地自动双屏（Windows）：只需下载并双击 `HIT-HTML-local.cmd`，点击“演讲者”并允许屏幕管理权限。页面和文件都在本机，不需要公网。
          直接打开 `file://` HTML 是否能自动跨屏取决于浏览器的本地权限；页面无法绕过授权。本地启动包用于避开该差异。
          EOF
          if gh release view v1.2 > /dev/null 2>&1; then
            gh release upload v1.2 HIT-HTML.html dist/HIT-HTML-local.cmd --clobber
          else
            gh release create v1.2 HIT-HTML.html dist/HIT-HTML-local.cmd \
              --target "$GITHUB_SHA" \
              --title "HIT-HTML v1.2" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft
          fi
          gh release download v1.2 \
            --pattern HIT-HTML.html \
            --pattern HIT-HTML-local.cmd \
            --dir "$RUNNER_TEMP/release-v1.2"
          cmp HIT-HTML.html "$RUNNER_TEMP/release-v1.2/HIT-HTML.html"
          cmp dist/HIT-HTML-local.cmd "$RUNNER_TEMP/release-v1.2/HIT-HTML-local.cmd"
          if [[ "$(gh release view v1.2 --json assets --jq 'any(.assets[]; .name == "HIT-HTML-local-v1.2.zip")')" == true ]]; then
            gh release delete-asset v1.2 HIT-HTML-local-v1.2.zip --yes
          fi
          test "$(gh release view v1.2 --json assets --jq '.assets | map(.name) | sort | join(",")')" = 'HIT-HTML-local.cmd,HIT-HTML.html'
          gh release edit v1.2 --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.md"



