name: Publish or Update v1.3 Release

on:
  push:
    branches: [main]
    paths: [HIT-HTML.html, docs/RELEASE_v1.3.md, .github/workflows/release.yml, tools/local/**, tools/package_local.py, tests/launcher-browser.cjs, tests/web-presenter-fullscreen.cjs, tests/web-swap.cjs, tests/native-displays.sh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.3
  cancel-in-progress: false

jobs:
  verify-windows:
    uses: ./.github/workflows/local-launcher.yml

  release:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify repeated web swaps with delayed window placement
        run: node tests/web-swap.cjs
      - name: Build single-file local launcher
        run: python3 tools/package_local.py
      - name: Verify screen placement, fullscreen and local shutdown
        env:
          HIT_POWERSHELL_EXECUTABLE: pwsh
          HIT_VERIFY_LAUNCHER_SCREENS: '1'
          POWERSHELL_TELEMETRY_OPTOUT: '1'
          POWERSHELL_UPDATECHECK: 'Off'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y xserver-xorg-core xserver-xorg-video-dummy x11-utils x11-xserver-utils openbox
          bash tests/native-displays.sh
          node tests/local-launcher.cjs
          node tests/launcher-browser.cjs
      - name: Upload, verify and publish v1.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.3 > /dev/null 2>&1; then
            gh release upload v1.3 HIT-HTML.html dist/HIT-HTML-local.cmd --clobber
          else
            gh release create v1.3 HIT-HTML.html dist/HIT-HTML-local.cmd \
              --target "$GITHUB_SHA" \
              --title "HIT-HTML v1.3" \
              --notes-file docs/RELEASE_v1.3.md \
              --draft
          fi
          gh release download v1.3 \
            --pattern HIT-HTML.html \
            --pattern HIT-HTML-local.cmd \
            --dir "$RUNNER_TEMP/release-v1.3"
          cmp HIT-HTML.html "$RUNNER_TEMP/release-v1.3/HIT-HTML.html"
          cmp dist/HIT-HTML-local.cmd "$RUNNER_TEMP/release-v1.3/HIT-HTML-local.cmd"
          test "$(gh release view v1.3 --json assets --jq '.assets | map(.name) | sort | join(",")')" = 'HIT-HTML-local.cmd,HIT-HTML.html'
          gh release edit v1.3 --draft=false --latest --notes-file docs/RELEASE_v1.3.md



