name: Publish or Update v1.2 Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, tools/local/**, tools/package_local.py, tests/launcher-browser.cjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.2
  cancel-in-progress: false

jobs:
  verify-windows:
    uses: ./.github/workflows/local-launcher.yml

  release:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build single-file local launcher
        run: python3 tools/package_local.py
      - name: Verify screen placement, fullscreen and local shutdown
        env:
          HIT_POWERSHELL_EXECUTABLE: pwsh
          HIT_VERIFY_LAUNCHER_SCREENS: '1'
          POWERSHELL_TELEMETRY_OPTOUT: '1'
          POWERSHELL_UPDATECHECK: 'Off'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          node tests/local-launcher.cjs
          node tests/launcher-browser.cjs
      - name: Upload, verify and publish v1.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          哈尔滨工业大学学术汇报 HTML 模板，支持离线放映与双屏演讲。

          - **HIT 风格模板**：16:9 画布，包含封面、正文、图表、结尾与空白母版。
          - **演讲者工作台**：当前页与下一页预览、逐页讲稿、全程与本页计时、字号和布局调整。
          - **双屏放映**：同步翻页、选择播放屏幕、观众全屏与双屏互换。
          - **总览与导出**：缩略图跳转、章节导航、键盘与触屏操作、打印或导出 PDF。
          - **Windows 单文件启动**：一个 CMD 即可离线使用；首页与工作台窗口显示，观众页面默认在副屏全屏，支持一键结束。

          **下载使用**

          - `HIT-HTML.html`：用浏览器直接打开，适合单屏或手动双屏。
          - `HIT-HTML-local.cmd`：Windows 用户双击运行，无需 Python 或管理员权限。将显示设为“扩展”，点击“演讲者”并允许屏幕管理权限；结束时在终端按 `Q` 或 `Esc`（无需回车）。

          [在线预览](https://dsqsqblxhq.github.io/HIT-PowerPoint-html/HIT-HTML.html) · [使用指南](https://github.com/DSQsqblxhq/HIT-PowerPoint-html/blob/main/docs/USAGE.md) · [来源与许可](https://github.com/DSQsqblxhq/HIT-PowerPoint-html/blob/main/docs/THIRD_PARTY_NOTICES.md)
          EOF
          if gh release view v1.2 > /dev/null 2>&1; then
            gh release upload v1.2 HIT-HTML.html dist/HIT-HTML-local.cmd --clobber
          else
            gh release create v1.2 HIT-HTML.html dist/HIT-HTML-local.cmd \
              --target "$GITHUB_SHA" \
              --title "HIT-HTML v1.2" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft
          fi
          gh release download v1.2 \
            --pattern HIT-HTML.html \
            --pattern HIT-HTML-local.cmd \
            --dir "$RUNNER_TEMP/release-v1.2"
          cmp HIT-HTML.html "$RUNNER_TEMP/release-v1.2/HIT-HTML.html"
          cmp dist/HIT-HTML-local.cmd "$RUNNER_TEMP/release-v1.2/HIT-HTML-local.cmd"
          if [[ "$(gh release view v1.2 --json assets --jq 'any(.assets[]; .name == "HIT-HTML-local-v1.2.zip")')" == true ]]; then
            gh release delete-asset v1.2 HIT-HTML-local-v1.2.zip --yes
          fi
          test "$(gh release view v1.2 --json assets --jq '.assets | map(.name) | sort | join(",")')" = 'HIT-HTML-local.cmd,HIT-HTML.html'
          gh release edit v1.2 --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.md"



