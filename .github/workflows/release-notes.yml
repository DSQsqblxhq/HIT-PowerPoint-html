name: Update v1.3 Release Notes

on:
  push:
    branches: [main]
    paths:
      - docs/RELEASE_v1.3.md
      - .github/workflows/release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes-v1.3
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.3 > /dev/null 2>&1; then
            gh release edit v1.3 --notes-file docs/RELEASE_v1.3.md
          else
            echo "v1.3 will be created with these notes by release.yml."
          fi
